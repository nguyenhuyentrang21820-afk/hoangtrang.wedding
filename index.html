<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Thiệp cưới Doãn Hoàng &amp; Huyền Trang</title>
<meta property="og:title" content="Thiệp cưới Doãn Hoàng &amp; Huyền Trang"><meta property="og:type" content="website"><meta name="theme-color" content="#1D5421">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Charm:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=Dancing+Script:wght@400;600&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
</head><body>
<style id="css">
:root{
  /* Layout: a phone-width invitation column; full-bleed photo bands alternate with textured paper sections; a green linen envelope with a wax seal opens it */
  --field:#DCE2D8;
  --paper:#F8F8F4;
  --green:#1D5421;
  --green-deep:#113A14;
  --green-soft:#58775A;
  --line:#B5C8B0;
  --mint:#C9E7C3;
  --linen:#3E7A3F;
  --white:#FFFFFF;
  --rib-1:#175A24;
  --rib-2:#4FA45E;
  --rib-3:#2E8040;
  --ph-d1:#3C5B3F;
  --ph-d2:#1A2D1C;
  --ph-l1:#E4EAE0;
  --ph-l2:#C9D6C4;
  --panel:#FFFFFF;
  --panel-2:#F3F5F1;
  --muted:#5F6F5E;
  --mint-bg:#DCEADF;
  --chip:#C7DCCB;
  --star:#7FB08A;
  --danger:#A23B32;
  --f-caps:"Cormorant Garamond","Times New Roman",serif;
  --f-serif:"Lora",Georgia,serif;
  --f-script:"Great Vibes","Segoe Script",cursive;
  --f-ui:system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--field)}
html.locked{overflow:hidden}
body{background:var(--field);color:var(--green);font-family:var(--f-serif);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--rib-2);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.pad{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

.page{position:relative;max-width:440px;margin:0 auto;background:var(--paper) var(--paper-tex,none);background-size:300px;box-shadow:0 0 60px -20px rgba(17,58,20,.35);overflow:hidden}
.sample-note{background:var(--mint);color:var(--green-deep);font-family:var(--f-ui);font-size:13px;line-height:1.5;padding:10px 24px;text-align:center}
.script{font-family:var(--f-script);font-weight:400;line-height:1.2}
.caps-h{font-family:var(--f-serif);font-weight:400;font-size:34px;line-height:1.15;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.ph{display:block;background:linear-gradient(160deg,var(--ph-l1),var(--ph-l2))}
.ph-d{background:radial-gradient(120% 80% at 50% 30%,var(--ph-d1),var(--ph-d2))}
.deco{position:absolute;z-index:1;pointer-events:none}
.deco svg{display:block;width:100%;height:100%;overflow:visible}
.deco-img img{display:block;width:100%;height:100%;object-fit:contain}
section{position:relative}

/* hero */
.hero{position:relative;aspect-ratio:9/16;max-height:880px;width:100%;overflow:hidden;color:var(--white);text-align:center}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 26%,transparent 55%,rgba(0,0,0,.5))}
.hero-s{position:absolute;left:0;right:0;top:3%;font-family:var(--f-script);font-size:clamp(52px,16vw,72px);line-height:1.2;opacity:.94}
.hero-b{position:absolute;left:0;right:0;bottom:7%;padding-inline:20px}
.hero-amp{position:absolute;left:50%;top:-12%;transform:translateX(-50%);font-family:var(--f-script);font-size:190px;line-height:1;opacity:.28;pointer-events:none}
.hero-n{position:relative;margin:0;font-family:var(--f-caps);font-weight:500;font-size:clamp(34px,10.5vw,46px);line-height:1.08;letter-spacing:.02em;text-transform:uppercase;display:grid}
.hero-d{position:relative;margin-top:26px;font-family:var(--f-serif);font-size:27px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .seal-btn{animation:pulse 2.4s ease-in-out infinite}
  .music.on i{animation:spin 4s linear infinite}
  .seal-btn,.cv-hand{transition:transform .35s ease,opacity .3s}
  .ev-flap{transition:transform .75s cubic-bezier(.6,0,.3,1) .15s}
  .cv{transition:transform 1.3s cubic-bezier(.4,0,.2,1) .3s}
  .env{transition:opacity .6s ease .85s}
  .cv-hand{animation:tap 1.6s ease-in-out infinite}
  .cv-st{stroke-dasharray:1;animation:cvDraw 2.6s cubic-bezier(.4,0,.2,1) .2s backwards}
  .cv-lf{animation:rvFade 1s ease-out calc(.9s + var(--i)*.09s) backwards}
  .cv-sp{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .cv-glow{animation:cvGlow 5s ease-in-out infinite alternate}
  .cv-pt{animation:cvFall linear infinite}
  .cv-pt i{animation:cvSway ease-in-out infinite alternate}
}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* intro */
.intro{padding-top:52px;padding-bottom:210px;text-align:center}
.mono{position:relative;width:120px;height:110px;margin:0 auto 18px}
.mono .m1{position:absolute;left:14px;top:-6px;font-family:var(--f-caps);font-weight:500;font-size:96px;line-height:1}
.mono .m2{position:absolute;left:52px;top:34px;font-family:var(--f-script);font-size:78px;line-height:1}
.intro-t{font-family:var(--f-serif);font-size:16.5px;line-height:1.45;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.vline{display:block;width:1px;height:50px;background:var(--green);margin:16px auto}
.std{font-family:var(--f-serif);font-size:38px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.std i{font-family:var(--f-script);font-style:normal;font-size:.72em;text-transform:none;color:var(--green-soft);margin:0 .12em}
.std-d{font-size:23px;letter-spacing:.08em;margin-top:6px;font-variant-numeric:tabular-nums}
.pair{position:relative;z-index:2;margin:44px auto 0;width:92%;background:var(--white);padding:12px;box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
.pair-in{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair-in>*{width:100%;aspect-ratio:3/4.4;object-fit:cover;display:block}
/* one shared photo split across both frames: each frame shows its half of an image as wide as both frames plus the gap */
.sp{position:relative;overflow:hidden}
.sp img{position:absolute;top:0;height:100%;width:calc(200% + 12px);max-width:none;object-fit:cover}
.sp-l img{left:0}
.sp-r img{right:0}
.band{position:absolute;left:0;right:0;border-radius:1px;top:calc(50% - 3.5px);height:7px;background:linear-gradient(180deg,var(--rb-d),var(--rb-l) 38%,var(--rb-h) 48%,var(--rb-m) 64%,var(--rb-d));box-shadow:0 2px 3px -1px rgba(0,0,0,.28)}
.bow{position:absolute;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
body.editing .bow,body.editing [data-move]{cursor:move;touch-action:none}
body.editing [data-move]{outline:1px dashed rgba(255,255,255,.7);outline-offset:4px}
.deco.i1{left:-34px;top:361px;width:150px;height:250px;transform:rotate(-14deg)}
.deco.i2{right:-34px;bottom:144px;width:150px;height:170px;transform:rotate(-22deg);z-index:3}

/* family */
.strip{display:block;width:100%;aspect-ratio:16/8.5;object-fit:cover}
.fam-in{position:relative;padding-top:30px;padding-bottom:44px;text-align:center}
.deco.f1{left:-14px;top:-150px;width:118px;height:162px;transform:rotate(12deg);z-index:3}
.deco.f2{left:-30px;bottom:-14px;width:120px;height:210px;transform:rotate(-4deg)}
.fams{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1px 1fr;gap:14px;align-items:start}
.fams>div{min-width:0}
.fams h3{margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fams p{font-size:13.5px;line-height:1.5}
.fams .sep{align-self:stretch;background:var(--green)}
.inv{position:relative;z-index:2;margin:24px auto 0;max-width:32ch;font-size:15px}
.inv b{font-weight:600}
.nm{position:relative;z-index:2;margin:26px 0 0;font-family:var(--f-serif);font-weight:400;font-size:clamp(34px,10vw,42px);line-height:1.08;text-transform:uppercase;display:grid}
.nm i{font-family:var(--f-script);font-style:normal;font-size:.62em;text-transform:none;color:var(--green-soft);line-height:1.3}
.cer{position:relative;z-index:2;margin-top:22px;font-size:14px;letter-spacing:.03em;text-transform:uppercase;line-height:1.5;white-space:nowrap}
.drow{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;max-width:280px;margin:12px auto 0}
.drow span{border-block:1px solid var(--green);padding:4px 0;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.drow b{font-size:44px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.lun{position:relative;z-index:2;margin-top:8px;font-style:italic;font-size:14px}
.at{position:relative;z-index:2;margin-top:24px;font-size:14px}
.vn{position:relative;z-index:2;margin-top:2px;font-size:21px;font-weight:600;line-height:1.3;text-transform:uppercase;text-wrap:balance}
.va{position:relative;z-index:2;margin-top:4px;font-style:italic;font-size:14px;max-width:30ch;margin-inline:auto}
.vmap{position:relative;z-index:2;margin-top:20px;border-radius:14px;overflow:hidden;background:var(--panel-2);box-shadow:0 8px 22px -12px rgba(17,58,20,.45);aspect-ratio:1/.86}
.vmap iframe{display:block;width:100%;height:100%;border:0}
.dir{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;margin-top:22px;color:var(--green);text-decoration:none;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.xev{position:relative;z-index:2;display:grid;gap:10px;margin-top:26px;text-align:center}
.xev div{border-top:1px solid var(--line);padding-top:12px}
.xev h3{margin:0;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.xev p{font-size:13.5px}
.xev a{color:var(--green);font-size:13px;font-weight:600}

/* love story */
.story{aspect-ratio:4/5.2;color:var(--white);text-align:center;overflow:hidden}
.story .shade{background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 45%,rgba(0,0,0,.08) 60%,rgba(0,0,0,.45))}
.story-t{position:absolute;width:calc(100% - 48px);transform:translateX(-50%);font-size:calc(13.5px*var(--k,1));line-height:1.55;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.story-t p+p{margin-top:10px}
.story-h{position:absolute;width:100%;transform:translate(-50%,-100%)}
.story-h .script{font-size:calc(clamp(56px,17vw,76px)*var(--k,1));line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.story-h .cap{font-size:calc(26px*var(--k,1));letter-spacing:.04em;margin-top:4px}

/* couple */
.couple{padding-top:44px;padding-bottom:50px;overflow:hidden}
.deco.c1{right:-30px;top:34px;width:150px;height:290px;transform:scaleX(-1) rotate(-6deg)}
.deco.c2{left:-48px;bottom:22px;width:190px;height:200px;transform:rotate(10deg)}
.cl{position:relative;z-index:2}
.cl .script{font-size:34px;color:var(--green-soft);line-height:1.1;margin-left:-4px}
.cl .cn{font-size:26px;line-height:1.15;text-transform:uppercase}
.cl .cb{font-size:19px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.cl-b{padding-left:38%;margin-top:18px}
.pols{position:relative;z-index:2;margin-top:24px}
.pol{margin:0;background:var(--white);padding:9px;box-shadow:0 10px 24px -8px rgba(0,0,0,.35)}
.pol>*{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.pol.pa{width:60%;transform:rotate(-4deg);margin-left:2%}
.pol.pb{width:58%;margin-left:auto;margin-top:-16%;transform:rotate(4deg)}
.seal-s{position:absolute;left:46%;top:46%;width:96px;height:96px;transform:translate(-50%,-50%) rotate(-10deg);z-index:3}

.feat img,.feat .ph{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}

/* timeline */
.tline{padding-top:46px;padding-bottom:46px;overflow:hidden}
.deco.t1{left:-24px;top:-10px;width:140px;height:165px;transform:rotate(14deg)}
.tl-h{position:relative;z-index:2;text-align:right;padding-left:30%}
.tl-h .script{font-size:52px;color:var(--green-soft);margin-top:-6px;padding-right:20%}
.tl-g{position:relative;z-index:2;display:grid;grid-template-columns:44% 1fr;gap:20px;align-items:center;margin-top:20px;margin-left:calc(-1*max(24px,env(safe-area-inset-left,0px)))}
.tl-g>*{min-width:0}
.tl-ph img,.tl-ph .ph{display:block;width:100%;aspect-ratio:9/15;object-fit:cover}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.tl time{display:block;font-family:var(--f-script);font-size:36px;line-height:1.1;color:var(--green)}
.tl span{display:block;font-family:var(--f-script);font-size:25px;line-height:1.25;color:var(--green-soft)}

/* dress code */
.dress{padding-top:30px;padding-bottom:40px;text-align:center}
.dr-t{margin:16px auto 0;max-width:15em;font-size:29px;line-height:1.4;color:var(--green-soft);text-wrap:balance}
.dr-ph{width:78%;margin:26px calc(-1*max(24px,env(safe-area-inset-right,0px))) 0 auto}
.dr-ph img,.dr-ph .ph{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}

/* album */
.album{padding-top:36px;padding-bottom:36px}
.al-h{display:flex;align-items:baseline;justify-content:center;gap:10px}
.al-h .caps-h{font-size:46px}
.al-h .script{font-size:56px;color:var(--green-soft);line-height:1}
.love{display:block;width:100%;height:auto;margin-top:6px}
.gal{margin-top:26px;margin-inline:calc(-1*max(24px,env(safe-area-inset-left,0px)))}
.gal-main{position:relative}
.gal-img{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.gal-img img,.gal-img .ph,.gal-main>.ph{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.gal-a{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;background:none;color:var(--white);font-size:38px;line-height:1;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.gal-p{left:max(4px,env(safe-area-inset-left,0px))}
.gal-n{right:max(4px,env(safe-area-inset-right,0px))}
.gal-th{display:flex;gap:6px;overflow-x:auto;padding:8px max(8px,env(safe-area-inset-left,0px));scrollbar-width:none}
.gal-th button{flex:none;width:68px;height:68px;padding:0;border:0;background:none;cursor:pointer;opacity:.55}
.gal-th button.on{opacity:1;outline:2px solid var(--green);outline-offset:-2px}
.gal-th img{width:100%;height:100%;object-fit:cover;display:block}

/* rsvp */
.rsvp{padding-top:44px;padding-bottom:34px;text-align:center;overflow:hidden}
.deco.r1{right:-60px;top:150px;width:230px;height:250px;opacity:.38;transform:scaleX(-1) rotate(-12deg)}
.deco.r2{left:-30px;top:-96px;width:96px;height:150px;opacity:.55;transform:rotate(-8deg)}
.rs-in{position:relative;z-index:2;display:grid;gap:12px}
.rs-note{font-size:14.5px;margin-bottom:6px}
.rs-form{display:grid;gap:12px;text-align:left}
.pill-in{width:100%;padding:9px 18px;border:1px solid var(--green);border-radius:999px;background:rgba(255,255,255,.75);color:var(--green);font-size:15px}
textarea.pill-in{border-radius:16px;resize:vertical;min-height:92px}
select.pill-in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.pill-in::placeholder{color:var(--green-soft)}
.pill{display:flex;align-items:center;justify-content:center;width:100%;padding:9px 18px;border:1px solid var(--green);border-radius:999px;background:transparent;color:var(--green);font-family:var(--f-serif);font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.pill.solid{background:var(--green-deep);border-color:var(--green-deep);color:var(--white);font-weight:500}
.rsvp-out{padding:14px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;display:grid;gap:10px;font-family:var(--f-ui);font-size:14px;color:var(--green-deep)}
.rsvp-out textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);font-size:14px}
.out-b{display:flex;flex-wrap:wrap;gap:8px}
.btn-sm{display:inline-flex;align-items:center;padding:7px 14px;border:1px solid var(--green);background:var(--panel);color:var(--green);font-family:var(--f-ui);font-size:13px;cursor:pointer;text-decoration:none;border-radius:999px}
.btn-sm.solid{background:var(--green-deep);color:var(--white);border-color:var(--green-deep)}
.contact{margin-top:6px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.sel{user-select:all;font-weight:600;font-variant-numeric:tabular-nums}

/* countdown */
.cdown{padding-top:20px;padding-bottom:34px;text-align:center}
.cdown .script{font-size:58px;color:var(--green-soft);line-height:1}
.cd{display:flex;justify-content:center;align-items:flex-start;gap:8px;margin-top:4px}
.cd>div{display:grid;justify-items:center;min-width:52px}
.cd b{font-size:36px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.cd small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-soft)}
.cd i{font-style:normal;font-size:22px;line-height:1.7}
.cd-done{font-style:italic;font-size:18px}

/* wishes */
.wish{padding-top:30px;padding-bottom:40px;text-align:center}
.wish .hr{display:block;width:50px;height:1px;background:var(--green);margin:12px auto 8px}
.wish-sub{font-style:italic;font-size:13.5px;margin-bottom:18px}
.wl{max-height:420px;overflow-y:auto;text-align:left;border-top:1px solid var(--line)}
.wi{padding:14px 4px;border-bottom:1px solid var(--line)}
.wn{font-weight:600;font-size:16px}
.wt{font-size:14px;line-height:1.5;margin-top:2px;overflow-wrap:anywhere}
.wl-empty{padding:18px 4px;text-align:center;font-style:italic;font-size:14px;color:var(--green-soft)}
.rs-h{font-size:28px;margin-bottom:4px}
.pill:disabled{opacity:.55;cursor:default}

/* thanks */
.thx{display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:4/4.6;color:var(--white);text-align:center;overflow:hidden}
.thx .shade{background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.62))}
.thx-t{position:relative;padding-bottom:30px}
.thx-t .script{font-size:clamp(56px,17vw,74px);line-height:1}
.thx-t .prose{font-size:14px;line-height:1.55;font-weight:500;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.thx-t .prose p+p{margin-top:1.1em}
.foot{padding:16px 24px 86px;text-align:center;font-size:13px;letter-spacing:.1em;text-transform:uppercase}

/* envelope cover */
/* painted-water backdrop, "kính mời" + guest name, a cream lace envelope sealed with wax, the date below */

// Images live in the page as data URIs; show them through cached blob URLs so re-renders stay light
const blobs=new Map();
function dataToBlob(uri){
  const i=uri.indexOf(','),mime=uri.slice(5,i).split(';')[0]||'application/octet-stream',bin=atob(uri.slice(i+1)),a=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);
  return new Blob([a],{type:mime});

function toBlobUrl(key,uri){
  if(uri&&!/^data:/.test(uri))return uri;

  if(c&&c.uri===uri)return c.url;
  try{
    const url=URL.createObjectURL(dataToBlob(uri));
    if(c)URL.revokeObjectURL(c.url);
    blobs.set(key,{uri,url});
    return url;
  }catch(_){return uri;}
}

// n falling petals at seeded random spots; each falls in dur..dur+spread s, starting part-way down so the sky is never empty
function petalsHtml(n,seed,dur,spread){
  const f=v=>Math.round(v*10)/10,R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  let s='';
  for(let i=0;i<n;i++)s+=`<span class="cv-pt" style="left:${f(R()*100)}%;--s:${f(9+R()*9)}px;--sw:${f(14+R()*26)}px;animation-duration:${f(dur+R()*spread)}s;animation-delay:${f(-R()*(dur+spread))}s"><i style="animation-duration:${f(2.4+R()*2)}s"></i></span>`;
  return s;
}
// Cover decoration over a plain green ground: a double gold frame, line-drawn branches with leaves and a tulip in two corners

const COVER_BG=(()=>{

  const ang=(p,t)=>{const a=bz(p,Math.max(0,t-.01)),b=bz(p,Math.min(1,t+.01));return Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;};
  const bp=p=>`M${p[0]} ${p[1]}C${p.slice(2).join(' ')}`;

  const branch=(p,n,l0)=>{let s=`<path class="cv-st" pathLength="1" d="${bp(p)}"/>`;for(let i=1;i<=n;i++){const t=i/(n+1),q=bz(p,t),a=ang(p,t);s+=leaf(q[0],q[1],a+(i%2?-42:42),f(l0*(1-t*.45)));}const e=bz(p,1);return s+`<circle class="cv-lf" style="--i:${li++}" cx="${f(e[0])}" cy="${f(e[1])}" r="1.8"/>`;};
  const tulip=`<g class="cv-lf" style="--i:4" transform="translate(50 56) rotate(135)"><path d="M0 0C-10 -2 -12 -15 -9 -26C-6 -20 -3 -19 0 -24C3 -19 6 -20 9 -26C12 -15 10 -2 0 0Z"/><path d="M0 -23C-2 -15 -2 -7 0 0" fill="none"/></g>`;
  li=0;

    +branch([30,22,52,40,62,58,70,84],2,11);

  let sp='';for(let i=0;i<14;i++)sp+=`<svg class="cv-sp" viewBox="0 0 20 20" style="left:${f(4+R()*92)}%;top:${f(4+R()*92)}%;width:${f(6+R()*9)}px;animation-delay:${f(R()*3)}s" aria-hidden="true" focusable="false">${star}</svg>`;
  const pt=petalsHtml(16,91,9,8);
  return {bg:`<div class="cv-bg" aria-hidden="true"><div class="cv-glow"></div><div class="cv-frame"></div>${cornerSvg('cv-tl')}${cornerSvg('cv-br')}${sp}</div>`,fx:`<div class="cv-fx" aria-hidden="true">${pt}</div>`};
})();

const dlP=cap('downloads');
async function saveQr(i){
  const g=D.gifts[i],uri=g&&D.images[g.qr];
  if(!uri)return;
  const dl=await dlP;
  if(!dl){const a=document.createElement('a');a.href=uri;a.download='QR-'+(slug(g.who||g.holder)||'mung-cuoi')+(/png/.test(uri.slice(0,40))||/\.png$/.test(uri)?'.png':'.jpg');document.body.append(a);a.click();a.remove();return;}
  if(!dl){toast('Giữ ngón tay lên ảnh QR để lưu về máy, hoặc chụp màn hình.');return;}
  const ext=uri.startsWith('data:image/png')?'png':'jpg';
  try{await dl.save({filename:`QR-${slug(g.who||g.holder)||'mung-cuoi'}.${ext}`,data:dataToBlob(uri)});toast('Đã lưu mã QR');}
  catch(err){if(!err||err.code!=='declined')toast('Chưa lưu được ở đây. Giữ ngón tay lên ảnh QR để lưu, hoặc chụp màn hình.');}

document.addEventListener('submit',e=>{
  if(e.target.id!=='rsvp')return;
  e.preventDefault();
  const fm=e.target,out=fm.querySelector('#rsvp-out'),q=s=>fm.querySelector(s);
  const name=q('#rsvp-name').value.trim(),att=q('#rsvp-att').value,count=q('#rsvp-count').value,side=q('#rsvp-side').value,wish=q('#rsvp-wish').value.trim();
  out.hidden=false;
  if(!name){out.innerHTML='<p>Bạn điền tên giúp chúng mình nhé.</p>';q('#rsvp-name').focus();return;}
  if(!att){out.innerHTML='<p>Bạn chọn giúp chúng mình là có đến dự hay không nhé.</p>';q('#rsvp-att').focus();return;}
  if(SHEET_URL&&!fm.dataset.fallback){
    const btn=q('button[type=submit]');
    btn.disabled=true;out.innerHTML='<p>Đang gửi…</p>';
    fetch(SHEET_URL,{method:'POST',body:JSON.stringify({name,attend:att,count,side,wish})})
      .then(r=>r.json()).then(j=>{
        if(!j||!j.ok)throw new Error('save failed');
        out.innerHTML=`<p><b>Cảm ơn ${esc(name)}!</b></p><p>${att==='yes'?'Chúng mình đã nhận được xác nhận của bạn. Hẹn gặp bạn trong ngày vui nhé!':'Chúng mình đã nhận được lời nhắn của bạn. Cảm ơn bạn rất nhiều!'}</p>`;
        q('#rsvp-wish').value='';

      })
      .catch(()=>{fm.dataset.fallback='1';out.innerHTML='<p>Chưa gửi được do lỗi kết nối. Bấm gửi lần nữa để sao chép lời nhắn và gửi qua Zalo nhé.</p>';})
      .finally(()=>{btn.disabled=false;});
    return;
  }
  const o=order(),z=digits(D.rsvp.phone);

  out.innerHTML=`<p><b>Lời nhắn của bạn</b></p><textarea id="rsvp-msg" rows="5" readonly>${esc(msg)}</textarea><p id="rsvp-note">Đang sao chép…</p><div class="out-b"><button type="button" class="btn-sm" data-copy="${esc(msg)}">Sao chép lại</button>${z?`<a class="btn-sm solid" href="https://zalo.me/${z}" target="_blank" rel="noopener">Mở Zalo để gửi</a>`:''}</div>`;
  const note=out.querySelector('#rsvp-note');
  const failed=()=>{note.textContent='Hãy chọn và sao chép nội dung trên, rồi gửi qua Zalo hoặc tin nhắn.';out.querySelector('#rsvp-msg').select();};
  try{navigator.clipboard.writeText(msg).then(()=>{note.textContent=z?'Đã sao chép. Bấm Mở Zalo, dán vào ô chat rồi gửi nhé.':'Đã sao chép. Bạn dán vào tin nhắn gửi cô dâu chú rể nhé.';},failed);}catch(_){failed();}

function compress(file,max,q,png){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{

      const w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      compress.ratio=Math.round(h/w*100)/100;
      const x=c.getContext('2d');
      if(png!=='alpha'){x.fillStyle='#FFFFFF';x.fillRect(0,0,w,h);}
      x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      if(png==='alpha'){const u=c.toDataURL('image/webp',q);res(u.startsWith('data:image/webp')?u:c.toDataURL('image/png'));}
      else res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};
    im.src=url;
  });
}

    case 'design':enterDesign();break;
    case 'layoutreset':D.layout={};changed(true);break;
    case 'copylink':copyText(guestLink(D.guests[i].name));break;
    case 'bulk':{
      const ta=ed.querySelector('#f-bulk'),names=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!names.length){updateStatus('Hãy nhập ít nhất một tên, mỗi dòng một tên.');return;}
      names.forEach(n=>D.guests.push({name:n}));changed(true);
      updateStatus(`Đã thêm ${names.length} khách. Nhớ bấm Lưu thiệp.`);break;
    }
  }
});

function gc(){
  const used=new Set([D.groom.photo,D.bride.photo,...Object.values(D.photos),...D.album,...D.flowers,...D.gifts.map(g=>g.qr)].filter(Boolean));
  for(const id in D.images)if(!used.has(id))delete D.images[id];
  for(const id in D.fmeta)if(!D.images[id])delete D.fmeta[id];
}
function buildHtml(){
  const json=JSON.stringify(D).replace(/</g,'\\u003c');
  const css=document.getElementById('css').textContent,js=document.getElementById('main').textContent,end='</scr'+'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +'<title>'+esc(pageTitle())+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTS
    +'\n<style id="css">'+css+'</style>\n<div id="root"></div>\n<script type="application/json" id="wedding-data">'+json+end
    +'\n<script id="main">'+js+end+'\n</body></html>';
}
async function save(){
  const btn=ed.querySelector('#ed-save');
  gc();D.isSample=false;D.savedAt=Date.now();
  const html=buildHtml();
  if(html.length>15.8e6){updateStatus('Thiệp đang quá nặng. Hãy bớt vài ảnh trong album rồi lưu lại.');return;}
  btn.disabled=true;updateStatus('Đang lưu…');
  const art=await artP;
  if(!art){btn.disabled=false;updateStatus('Không lưu được ở đây. Hãy mở thiệp trong claude.ai bằng tài khoản đã tạo thiệp.');return;}
  try{sessionStorage.setItem('wd-draft',JSON.stringify(D));}catch(_){}
  try{await art.publish(html);updateStatus('Đã lưu. Thiệp đang tải lại…');}
  catch(err){
    btn.disabled=false;
    const c=err&&err.code;
    if(c==='conflict'){updateStatus('Thiệp vừa được cập nhật ở nơi khác. Trang sẽ tải lại và giữ bản đang sửa của bạn.');return;}
    try{sessionStorage.removeItem('wd-draft');}catch(_){}
    updateStatus(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'?'Tài khoản này chỉ có quyền xem nên không lưu được.'
      :c==='too_large'?'Thiệp đang quá nặng. Hãy bớt vài ảnh rồi lưu lại.'
      :c==='rate_limited'?'Bạn vừa lưu nhiều lần liền. Đợi một phút rồi bấm Lưu thiệp lại.'
      :'Chưa lưu được do lỗi kết nối. Bấm Lưu thiệp để thử lại.');
  }
}
function enableEdit(){
  if(canEditView)return;
  canEditView=true;
  if(!editing)fab.hidden=false;
  render();
}

// ---------- Boot ----------
D.photos=D.photos||{};D.album=(D.album||[]).filter(id=>D.images[id]);D.flowers=(D.flowers||[]).filter(id=>D.images[id]);D.fmeta=D.fmeta||{};D.guests=D.guests||[];D.wishes=D.wishes||[];D.events=D.events||[];
let restored=false,justSaved=false;
try{
  const dr=JSON.parse(sessionStorage.getItem('wd-draft')||'null');
  if(dr){sessionStorage.removeItem('wd-draft');if(dr.savedAt===D.savedAt)justSaved=true;else{D=dr;restored=true;}}
}catch(_){}
if(justSaved||restored)coverDone=true;
applyTextures();
document.body.insertAdjacentHTML('afterbegin',buildArt());
const petalEl=document.createElement('div');
petalEl.className='petals';petalEl.setAttribute('aria-hidden','true');petalEl.innerHTML=petalsHtml(12,2024,11,9);
document.body.append(petalEl,envEl,ed,fab,giftEl,lb,toastEl);
render();
setInterval(tick,1000);
loadWishes();
cap('user').then(u=>u?u.canEdit():false).catch(()=>false).then(ok=>{if(ok)enableEdit();});
if(location.hash==='#edit')enableEdit();
addEventListener('hashchange',()=>{if(location.hash==='#edit')enableEdit();else render();});
if(restored){enableEdit();dirty=true;openEditor();toast('Đã khôi phục bản đang sửa dở. Bấm Lưu thiệp để lưu lại.');}
if(justSaved)toast('Đã lưu thiệp. Ai mở link cũng sẽ thấy bản mới nhất.');
})();
</script>
</body></html>
